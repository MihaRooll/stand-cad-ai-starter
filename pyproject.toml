[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stand-cad"
version = "0.1.0"
description = "AI-first parametric CAD workflow for a light desktop plotter tower"
requires-python = ">=3.12,<3.13"
dependencies = [
  "build123d==0.11.1",
  "pyyaml>=6.0.3",
  "reportlab>=5.0,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "pytest-xdist>=3.6,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/stand_cad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -n auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


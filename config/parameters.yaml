# config/parameters.yaml
#
# Single dimensional source of truth for the Light Plotter Tower, per
# "ИИ советы/Cursor_Opus5_TZ_Light_Plotter_Tower.md" ("TZ"), section 12.
# Owner priority override 2026-08-04 (PLT-007) supersedes vertical film storage and
# several fixed TZ envelope coordinates — see state/DECISION_LOG.md.
#
# Every leaf is a mapping {value, provenance, note}. provenance is exactly one of:
#   verified   - manufacturer documentation or the owner's fixed decision recorded in the TZ.
#   derived    - computed from verified values; the formula lives in src/stand_cad/parameters.py
#                docstrings/comments, never re-hardcoded here.
#   to_measure - must be measured on the real machine/material before production release.
# src/stand_cad/parameters.py fails closed if a leaf lacks a valid provenance marker.
#
# film_storage_horizontal.shelf_stack_height_mm is NOT stored here: it is derived at load time
# from shelf_count, compartment_clear_height_mm, and divider_thickness.

schema_version: 1
units: mm

case:
  width: {value: 650, provenance: verified, note: "TZ section 4 — overall envelope; owner 2026-08-04 confirmed not flexible"}
  depth: {value: 420, provenance: verified, note: "TZ section 4 original target 550 mm; owner 2026-08-05 override reduces to 420 mm (within owner's stated 350-450 mm range) — see D-045. Owner 2026-08-06 confirmed keep 420 mm — pull-out drawer mechanism stays, this is not a fixed-shelf design."}
  height: {value: 529, provenance: derived, note: "film_storage_horizontal.z + shelf_stack_height_mm + top_structure.height_mm = 423 + 106 + 0; formula in Parameters.computed_case_height_mm. Owner 2026-08-06: was 544 (top_structure.height_mm=15) — that 15 mm band above the top rail line was unfilled by any part (no lid/cover was ever modeled there), so it read as a bare unsupported skin lip / awkward corner-post nub in every top-down view; owner asked to remove it for event-display aesthetics. Reducing to 0 makes posts, rails, and outer panels all terminate flush at the same Z with no code change needed elsewhere (frame.py's corner-post cap logic already no-ops when the band height is 0). Independent of D-038's +27 mm (517→544 was upper_z/tray-hardware clearance, untouched here)."}
  internal_width: {value: 610, provenance: verified, note: "TZ section 4 — 650−2×20 mm side slabs; Main PLT-007 ruling 2026-08-04 rejects widening to 620/630 (R10 at 20 mm wall beats R7.5/R5 at narrower walls)"}
  depth_tolerance_mm: {value: 5, provenance: verified, note: "Owner 2026-08-04 allowance for case.depth deviation from 550 mm target; used by PARAM-006"}
  corner_radius: {value: 25, provenance: verified, note: "TZ section 8 line 230 — R20-R30 outer shell corner radius; consumed by PANEL-OUT-REAR-* corner trims only (side slabs use side_slab_bullnose_radius_mm)"}
  side_slab_bullnose_radius_mm: {value: 10, provenance: derived, note: "side_clear/2 with side_clear=(650−610)/2=20 mm; PLT-006 R10 ruling retained — widening niche would reduce max bullnose (D-026)"}

tolerance:
  assembly_mm: {value: 1, provenance: verified, note: "TZ section 15 — overall assembly tolerance"}
  part_cnc_laser_mm: {value: 0.3, provenance: verified, note: "TZ section 15 — CNC/laser part tolerance unless stated otherwise"}
  part_assembly_feature_mm: {value: 0.5, provenance: verified, note: "TZ section 15 — assembly-feature tolerance unless stated otherwise"}


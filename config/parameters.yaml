# config/parameters.yaml
#
# Single dimensional source of truth for the Light Plotter Tower, per
# "ИИ советы/Cursor_Opus5_TZ_Light_Plotter_Tower.md" ("TZ"), section 12.
# Owner priority override 2026-08-04 (PLT-007) supersedes vertical film storage and
# several fixed TZ envelope coordinates — see state/DECISION_LOG.md.
#
# Every leaf is a mapping {value, provenance, note}. provenance is exactly one of:
#   verified   - manufacturer documentation or the owner's fixed decision recorded in the TZ.
#   derived    - computed from verified values; the formula lives in src/stand_cad/parameters.py
#                docstrings/comments, never re-hardcoded here.
#   to_measure - must be measured on the real machine/material before production release.
# src/stand_cad/parameters.py fails closed if a leaf lacks a valid provenance marker.
#
# film_storage_horizontal.shelf_stack_height_mm is NOT stored here: it is derived at load time
# from shelf_count, compartment_clear_height_mm, and divider_thickness.

schema_version: 1
units: mm

case:
  width: {value: 650, provenance: verified, note: "TZ section 4 — overall envelope; owner 2026-08-04 confirmed not flexible"}
  depth: {value: 550, provenance: verified, note: "TZ section 4 target; owner 2026-08-04 allows small deviation if geometry requires (PARAM-006 depth tolerance ±5 mm)"}
  height: {value: 517, provenance: derived, note: "film_storage_horizontal.z + shelf_stack_height_mm + top_structure.height_mm = 396 + 106 + 15; formula in Parameters.computed_case_height_mm"}
  internal_width: {value: 610, provenance: verified, note: "TZ section 4 — 650−2×20 mm side slabs; Main PLT-007 ruling 2026-08-04 rejects widening to 620/630 (R10 at 20 mm wall beats R7.5/R5 at narrower walls)"}
  depth_tolerance_mm: {value: 5, provenance: derived, note: "Owner 2026-08-04 allowance for case.depth deviation from 550 mm target; used by PARAM-006"}
  corner_radius: {value: 25, provenance: verified, note: "TZ section 8 line 230 — R20-R30 outer shell corner radius; consumed by PANEL-OUT-REAR-* corner trims only (side slabs use side_slab_bullnose_radius_mm)"}
  side_slab_bullnose_radius_mm: {value: 10, provenance: derived, note: "side_clear/2 with side_clear=(650−610)/2=20 mm; PLT-006 R10 ruling retained — widening niche would reduce max bullnose (D-026)"}

tolerance:
  assembly_mm: {value: 1, provenance: verified, note: "TZ section 15 — overall assembly tolerance"}
  part_cnc_laser_mm: {value: 0.3, provenance: verified, note: "TZ section 15 — CNC/laser part tolerance unless stated otherwise"}
  part_assembly_feature_mm: {value: 0.5, provenance: verified, note: "TZ section 15 — assembly-feature tolerance unless stated otherwise"}

plotter:
  physical_width: {value: 570, provenance: verified, note: "Governing equipment — Silhouette Cameo 4 standard 12 inch; source https://www.silhouette101.com/wp-content/uploads/2020/01/cameo-4-spec-sheet.pdf (22.44 in = 570 mm)"}
  physical_depth: {value: 195, provenance: verified, note: "Cameo 4 governing depth; same spec sheet (7.68 in = 195 mm)"}
  physical_height: {value: 170, provenance: verified, note: "Cameo 4 governing height; same spec sheet (6.69 in = 170 mm)"}
  design_width: {value: 584, provenance: derived, note: "physical_width + 2×envelope_offset_x_mm = 570 + 14; offset formula unchanged from TZ (was +7 each side for Cameo 5)"}
  design_depth: {value: 219, provenance: derived, note: "physical_depth + 2×envelope_offset_y_mm = 195 + 24; offset +12 each side (TZ formula)"}
  design_height: {value: 178, provenance: derived, note: "physical_height + 2×envelope_offset_z_mm = 170 + 8; offset +4 each side (TZ formula); tier niches use max(178, tier_clearance_min 170)"}
  tier_clearance_min_mm: {value: 170, provenance: verified, note: "Owner 2026-08-04 — minimum clear height per plotter tier; equals Cameo 4 physical height"}
  x: {value: 40, provenance: derived, note: "side_clear + (internal_width − physical_width)/2 = 20 + (610−570)/2 = 40 mm"}
  lower_y: {value: 15, provenance: derived, note: "PLT-007 — reduced from TZ 20 mm so lower tray full extension (250 mm) clears front_overhang_min 40 mm with 195 mm Cameo 4 depth: 15+195−250=−40; front storage clearance 15 mm"}
  lower_z: {value: 30, provenance: verified, note: "TZ section 5 — lower tray / plotter 1 datum Z"}
  upper_y: {value: 145, provenance: derived, note: "lower_y + upper_setback = 15 + 130; supersedes TZ section 5 Y=170 and interim 150@lower_y=20"}
  upper_z: {value: 211, provenance: derived, note: "lower_z + tier_clearance_min_mm + tray_panel_thickness_mm = 30 + 170 + 11"}
  upper_setback: {value: 130, provenance: verified, note: "Owner 2026-08-04 — plotter 2 set back 130 mm (supersedes TZ 150 mm); must equal upper_y - lower_y"}
  feed_plane_z_from_base: {value: "TO_MEASURE", provenance: to_measure, note: "TZ section 7 and section 16 item 1 — must not be guessed"}
  feed_plane_z_provisional_mm: {value: 40, provenance: to_measure, note: "Provisional mid-low front-feed slot height above tray finished top; VERIFY ON REAL MACHINE before production DXF"}
  envelope_offset_x_mm: {value: 7, provenance: derived, note: "(design_width − physical_width)/2; legacy TZ clearance margin per side in X"}
  envelope_offset_y_mm: {value: 12, provenance: derived, note: "(design_depth − physical_depth)/2; legacy TZ clearance margin per side in Y"}
  envelope_offset_z_mm: {value: 4, provenance: derived, note: "(design_height − physical_height)/2; legacy TZ clearance margin per side in Z"}
  lid_open_envelope_height_mm: {value: 80, provenance: to_measure, note: "TZ section 16 item 3 — provisional open-lid swept height above physical_height; VERIFY ON REAL MACHINE"}


  physical_depth: {value: 195, provenance: verified, note: "Cameo 4 governing depth; same spec sheet (7.68 in = 195 mm)"}
  physical_height: {value: 170, provenance: verified, note: "Cameo 4 governing height; same spec sheet (6.69 in = 170 mm)"}
  design_width: {value: 584, provenance: derived, note: "physical_width + 2×envelope_offset_x_mm = 570 + 14; offset formula unchanged from TZ (was +7 each side for Cameo 5)"}
  design_depth: {value: 219, provenance: derived, note: "physical_depth + 2×envelope_offset_y_mm = 195 + 24; offset +12 each side (TZ formula)"}
  design_height: {value: 178, provenance: derived, note: "physical_height + 2×envelope_offset_z_mm = 170 + 8; offset +4 each side (TZ formula); tier niches use max(178, tier_clearance_min 170)"}
  tier_clearance_min_mm: {value: 170, provenance: verified, note: "Owner 2026-08-04 — minimum clear height per plotter tier; equals Cameo 4 physical height"}
  x: {value: 40, provenance: derived, note: "side_clear + (internal_width − physical_width)/2 = 20 + (610−570)/2 = 40 mm"}
  lower_y: {value: 15, provenance: derived, note: "PLT-007 — reduced from TZ 20 mm for front storage clearance 15 mm. D-029 arithmetic: TZ rear-face overhang (front_overhang_min 40 mm) needs extension ≥ lower_y+physical_depth+40 = 250 mm; owner D-049 restores full-service extension to 250 mm on both tiers — at 250 mm plotter rear Y=−40 mm (exact TZ margin), front Y=−235 mm"}
  lower_z: {value: 30, provenance: verified, note: "TZ section 5 — lower tray / plotter 1 datum Z"}
  upper_y: {value: 15, provenance: derived, note: "lower_y + upper_setback = 15 + 0 (D-033, owner 2026-08-04); supersedes TZ section 5 Y=170, interim 150@lower_y=20, and 145@setback130 (D-029)"}
  upper_z: {value: 238, provenance: derived, note: "lower_z + tier_clearance_min_mm + slide_rail_height_mm + frame_profile_size_mm + tray_panel_thickness_mm = 30 + 170 + 12 + 15 + 11"}
  upper_setback: {value: 0, provenance: verified, note: "Owner 2026-08-04 (D-033) — tier 2 aligned flush with tier 1 front face; setback removed. Supersedes 130 mm (D-029) and TZ 150 mm. Must equal upper_y - lower_y. Access to tier 2 solved by trays.lower_quick_access_extension_mm on tier 1 instead of a Y offset."}
  feed_plane_z_from_base: {value: "TO_MEASURE", provenance: to_measure, note: "TZ section 7 and section 16 item 1 — must not be guessed"}
  feed_plane_z_provisional_mm: {value: 40, provenance: to_measure, note: "Provisional mid-low front-feed slot height above tray finished top; VERIFY ON REAL MACHINE before production DXF"}
  envelope_offset_x_mm: {value: 7, provenance: derived, note: "(design_width − physical_width)/2; legacy TZ clearance margin per side in X"}
  envelope_offset_y_mm: {value: 12, provenance: derived, note: "(design_depth − physical_depth)/2; legacy TZ clearance margin per side in Y"}
  envelope_offset_z_mm: {value: 4, provenance: derived, note: "(design_height − physical_height)/2; legacy TZ clearance margin per side in Z"}
  lid_open_envelope_height_mm: {value: 80, provenance: to_measure, note: "TZ section 16 item 3 — provisional open-lid swept height above physical_height; VERIFY ON REAL MACHINE"}

